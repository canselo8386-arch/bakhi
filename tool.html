<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bóc Tách Bill - Groq AI (Qwen Vision)</title>
    <style>
        :root { --primary: #2ecc71; --border: #3498db; --text: #333; --bg: #f0f2f5; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        h2 { color: var(--text); margin-bottom: 20px; width: 100%; max-width: 900px; }
        
        .input-group { width: 100%; max-width: 900px; margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
        .input-group input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }

        #drop-zone { 
            width: 100%; max-width: 900px; height: 250px; border: 3px dashed var(--border); 
            border-radius: 10px; background: white; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; margin-bottom: 10px; position: relative; overflow: hidden; cursor: pointer;
        }
        #drop-zone p { color: #888; position: absolute; pointer-events: none; }
        #preview-img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; z-index: 10; }
        
        .upload-btn-wrapper { width: 100%; max-width: 900px; display: flex; justify-content: center; margin-bottom: 30px; }
        #btn-upload { background-color: var(--border); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        .main-container { display: flex; gap: 20px; width: 100%; max-width: 900px; }
        .result-section { flex: 1; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { display: grid; grid-template-columns: 130px 1fr 80px; gap: 10px; align-items: center; margin-bottom: 15px; }
        .form-group label { color: #1a73e8; font-weight: 600; font-size: 14px; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        .btn-copy { background: var(--primary); color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; font-weight: 600; }
        
        #loading { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); z-index: 20; justify-content: center; align-items: center; font-weight: bold; color: var(--border); flex-direction: column; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--border); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .debug-section { width: 350px; background: #2d2d2d; padding: 20px; border-radius: 10px; color: #fff; display: flex; flex-direction: column; }
        .debug-section textarea { flex: 1; width: 100%; background: #1e1e1e; color: #a9b7c6; border: none; padding: 10px; font-family: monospace; font-size: 12px; resize: none; }
        
        #error-log { display: none; width: 100%; max-width: 900px; background: #ffebee; color: #c62828; padding: 15px; border-radius: 5px; margin-top: 20px; font-weight: bold; border: 1px solid #ef9a9a; }
    </style>
</head>
<body>
    <h2>Bóc Tách Bill Bằng AI (Groq - Qwen Vision)</h2>
    
    <div class="input-group">
        <label style="font-weight: bold;">Nhập Groq API Key:</label>
        <input type="password" id="api-key" placeholder="Dán API Key gsk_... của bạn vào đây">
    </div>

    <div id="drop-zone">
        <p>Kéo thả ảnh vào đây</p>
        <img id="preview-img">
        <div id="loading"><div class="spinner"></div>AI đang phân tích ảnh...</div>
    </div>
    
    <div class="upload-btn-wrapper">
        <button id="btn-upload">📁 Chọn ảnh từ thiết bị</button>
    </div>

    <input type="file" id="file-input" accept="image/*" style="display: none;">

    <div class="main-container">
        <div class="result-section">
            <h3 style="margin-bottom: 15px;">Kết quả bóc tách:</h3>
            <div class="form-group"><label>Tên người nhận:</label><input type="text" id="res-name"><button class="btn-copy" onclick="copyText('res-name')">Copy</button></div>
            <div class="form-group"><label>Ngân hàng:</label><input type="text" id="res-bank"><button class="btn-copy" onclick="copyText('res-bank')">Copy</button></div>
            <div class="form-group"><label>Số tài khoản:</label><input type="text" id="res-account"><button class="btn-copy" onclick="copyText('res-account')">Copy</button></div>
            <div class="form-group"><label>Nội dung CK:</label><input type="text" id="res-content"><button class="btn-copy" onclick="copyText('res-content')">Copy</button></div>
            <div class="form-group"><label>Ngày tháng:</label><input type="text" id="res-date"><button class="btn-copy" onclick="copyText('res-date')">Copy</button></div>
        </div>
        <div class="debug-section">
            <h4>Raw Text / JSON:</h4>
            <textarea id="raw-text" readonly placeholder="Dữ liệu AI trả về sẽ hiện ở đây..."></textarea>
        </div>
    </div>

    <div id="error-log"></div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const previewImg = document.getElementById('preview-img');
        const loading = document.getElementById('loading');
        const defaultText = dropZone.querySelector('p');
        const btnUpload = document.getElementById('btn-upload');
        const apiKeyInput = document.getElementById('api-key');
        const errorLog = document.getElementById('error-log');

        dropZone.addEventListener('click', () => fileInput.click());
        btnUpload.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#1a73e8'; });
        dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#3498db'; });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.style.borderColor = '#3498db';
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = (error) => reject(error);
                reader.readAsDataURL(file);
            });
        }

        async function handleFile(file) {
            errorLog.style.display = 'none';
            errorLog.innerText = '';
            
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert("Vui lòng nhập Groq API Key trước khi bóc tách!");
                return;
            }

            loading.style.display = 'flex';
            
            try {
                const dataUrl = await readFileAsDataURL(file);
                previewImg.src = dataUrl; 
                previewImg.style.display = 'block'; 
                defaultText.style.display = 'none';

                const base64Image = dataUrl.split(',')[1];
                const mimeType = file.type || "image/jpeg";
                const imageUrl = `data:${mimeType};base64,${base64Image}`;

                const promptText = `
                    Bạn là chuyên gia bóc tách dữ liệu hóa đơn ngân hàng Việt Nam.
                    Hãy trích xuất thông tin từ hình ảnh hóa đơn chuyển khoản này.
                    Trả về DUY NHẤT một chuỗi JSON hợp lệ, không có text thừa, định dạng:
                    {
                        "name": "Tên người nhận",
                        "bank": "Tên ngân hàng nhận",
                        "account": "Số tài khoản nhận",
                        "content": "Nội dung chuyển khoản",
                        "date": "Ngày tháng (HH:mm - DD/MM/YYYY)"
                    }
                `;

                // Gọi Groq API với model Qwen 3.8 Vision
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "qwen/qwen3.8-27b",
                        messages: [
                            {
                                role: "user",
                                content: [
                                    { type: "text", text: promptText },
                                    { type: "image_url", image_url: { url: imageUrl } }
                                ]
                            }
                        ],
                        temperature: 0.1,
                        max_completion_tokens: 1024,
                        response_format: { type: "json_object" } // Yêu cầu Groq trả về JSON
                    })
                });

                const data = await response.json();
                document.getElementById('raw-text').value = JSON.stringify(data, null, 2);

                if (!response.ok) {
                    throw new Error(data.error?.message || "Lỗi không xác định từ Groq API");
                }

                let aiText = data.choices[0].message.content;
                
                // Làm sạch JSON (nếu AI bọc trong markdown)
                aiText = aiText.replace(/```json/g, '').replace(/```/g, '').trim();
                
                const result = JSON.parse(aiText);

                document.getElementById('res-name').value = result.name || "";
                document.getElementById('res-bank').value = result.bank || "";
                document.getElementById('res-account').value = result.account || "";
                document.getElementById('res-content').value = result.content || "";
                document.getElementById('res-date').value = result.date || "";

            } catch (error) {
                console.error(error);
                errorLog.style.display = 'block';
                errorLog.innerText = "LỖI: " + error.message;
            } finally {
                loading.style.display = 'none';
            }
        }

        function copyText(id) {
            const input = document.getElementById(id);
            if (!input.value) return alert('Không có dữ liệu!');
            navigator.clipboard.writeText(input.value).then(() => {
                const btn = input.nextElementSibling;
                const old = btn.innerText;
                btn.innerText = 'Đã chép!';
                btn.style.background = '#1a73e8';
                setTimeout(() => { btn.innerText = old; btn.style.background = ''; }, 1500);
            });
        }
    </script>
</body>
</html>
